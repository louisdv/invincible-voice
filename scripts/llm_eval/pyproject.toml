[project]
name = "llm-eval"
version = "0.1.0"
description = "InvincibleVoice LLM evaluation harness"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.55.0",
    "openai>=1.70.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "humanize>=4.12",
    "pydantic>=2.0",
]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"
